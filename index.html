<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACC Health Analytics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.15.4/umd/Recharts.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem; padding: 1.5rem; }
    .kpi { font-size: 2.5rem; font-weight: 800; color: #38bdf8; }
    .label { color: #94a3b8; font-size: 0.875rem; }
  </style>
</head>
<body class="min-h-screen p-8">
  <header class="mb-8">
    <h1 class="text-4xl font-extrabold tracking-tight text-white">ACC Health Analytics</h1>
    <p class="text-slate-400 mt-2">Reporting period: FY 2025/26 · Data refreshed: 24 Sept 2026</p>
  </header>

  <section class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
    <div class="card">
      <div class="label">New Claims</div>
      <div class="kpi">2.12M</div>
    </div>
    <div class="card">
      <div class="label">Total Cost</div>
      <div class="kpi">$9.08B</div>
    </div>
    <div class="card">
      <div class="label">Avg Claim Cost</div>
      <div class="kpi">$3,890</div>
    </div>
    <div class="card">
      <div class="label">YoY Growth</div>
      <div class="kpi">+1.8%</div>
    </div>
  </section>

  <section class="card mb-8">
    <h2 class="text-xl font-bold mb-4">Annual Trend (2015–2026)</h2>
    <div id="trend-chart" style="width:100%;height:300px;"></div>
  </section>

  <section class="card">
    <h2 class="text-xl font-bold mb-4">Injury Type Breakdown</h2>
    <div id="pie-chart" style="width:100%;height:300px;"></div>
  </section>

  <script>
    // Simple bar chart using Recharts
    const BarChart = Recharts.BarChart;
    const Bar = Recharts.Bar;
    const XAxis = Recharts.XAxis;
    const YAxis = Recharts.YAxis;
    const Tooltip = Recharts.Tooltip;
    const ResponsiveContainer = Recharts.ResponsiveContainer;
    const PieChart = Recharts.PieChart;
    const Pie = Recharts.Pie;
    const Cell = Recharts.Cell;

    const trendData = [
      {year:'2015',cost:3660},{year:'2018',cost:4220},{year:'2021',cost:5390},
      {year:'2024',cost:7380},{year:'2025',cost:8230},{year:'2026',cost:9080}
    ];

    ReactDOM.render(
      React.createElement(ResponsiveContainer, {width:'100%',height:300},
        React.createElement(BarChart, {data:trendData},
          React.createElement(XAxis, {dataKey:'year'}),
          React.createElement(YAxis),
          React.createElement(Tooltip),
          React.createElement(Bar, {dataKey:'cost',fill:'#38bdf8'})
        )
      ),
      document.getElementById('trend-chart')
    );

    const pieData = [
      {name:'Sport & Rec',value:35},{name:'Falls',value:25},{name:'Work',value:10},
      {name:'Motor Vehicle',value:5},{name:'Medical',value:2},{name:'Sensitive',value:1.5},{name:'Other',value:21.5}
    ];
    const COLORS = ['#38bdf8','#f472b6','#fbbf24','#a78bfa','#34d399','#f87171','#60a5fa'];

    ReactDOM.render(
      React.createElement(ResponsiveContainer, {width:'100%',height:300},
        React.createElement(PieChart, {},
          React.createElement(Pie, {data:pieData, cx:'50%',cy:'50%',labelLine:false,outerRadius:100,dataKey:'value'},
            pieData.map((entry,i)=>React.createElement(Cell,{key:`cell-${i}`,fill:COLORS[i%COLORS.length]}))
          ),
          React.createElement(Tooltip)
        )
      ),
      document.getElementById('pie-chart')
    );
  </script>
  <script src="https://unpkg.com/react@19/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@19/umd/react-dom.production.min.js"></script>
</body>
</html>
